<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - e-Mola</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background-color: #F27C00; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: white; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Caveat', cursive; font-size: 36px; color: #F27C00; font-weight: bold; margin: 0; }
        .sub { font-size: 12px; color: #666; margin-top: 0; }
        .title { font-family: 'Caveat', cursive; font-size: 28px; color: #333; text-align: center; margin: 20px 0; }

        .card { background: #fdfdfd; border: 1px solid #f0f0f0; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .label { font-size: 16px; color: #444; font-family: 'Caveat', cursive; font-weight: bold; }
        .value { font-size: 18px; color: #F27C00; font-weight: bold; }
        
        input[type=range] { width: 100%; -webkit-appearance: none; background: #f0f0f0; height: 8px; border-radius: 4px; margin: 15px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #F27C00; cursor: pointer; box-shadow: 0 2px 5px rgba(242,124,0,0.4); }
        
        .limits { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
        
        .result-box { background: #fff9f2; border: 1px solid #ffe4cc; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .result-label { font-size: 14px; color: #666; margin-bottom: 5px; font-family: 'Caveat', cursive; }
        .result-value { font-size: 32px; color: #F27C00; font-weight: bold; }
        
        .btn-main { width: 100%; background-color: #F27C00; color: white; font-size: 16px; font-weight: bold; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-family: 'Caveat', cursive; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="logo">e-Mola</h1>
            <p class="sub">Meu cell, minha mola</p>
        </div>
        
        <h2 class="title">Calculadora de Empréstimo</h2>

        <div class="card">
            <div class="row">
                <span class="label">Valor do Empréstimo</span>
                <span class="value" id="amountDisplay">25,000 MT</span>
            </div>
            <input type="range" id="amountSlider" min="10000" max="70000" step="1000" value="25000" oninput="calculate()">
            <div class="limits"><span>10.000 MT</span><span>70.000 MT</span></div>
        </div>

        <div class="card">
            <div class="row">
                <span class="label">Prazo do Empréstimo</span>
                <span class="value" id="termDisplay">6 Meses</span>
            </div>
            <input type="range" id="termSlider" min="1" max="12" step="1" value="6" oninput="calculate()">
            <div class="limits"><span>1 Mês</span><span>12 Meses</span></div>
        </div>

        <div class="result-box">
            <div class="result-label">Pagamento Mensal</div>
            <div class="result-value" id="paymentDisplay">4666.67 MT</div>
        </div>

        <button class="btn-main" onclick="
            sessionStorage.setItem('loanAmount', document.getElementById('amountSlider').value);
            sessionStorage.setItem('loanTerm', document.getElementById('termSlider').value);
            window.location.href = 'dados.html';
        ">SOLICITAR AGORA</button>
    </div>

    <script>
        function calculate() {
            var amount = parseFloat(document.getElementById('amountSlider').value);
            var term = parseFloat(document.getElementById('termSlider').value);
            
            document.getElementById('amountDisplay').innerText = amount.toLocaleString('pt-PT') + ' MT';
            document.getElementById('termDisplay').innerText = term + (term === 1 ? ' Mês' : ' Meses');

            // Simple interest for demonstration (e.g., 15% flat rate)
            var rate = 0.15; 
            var totalRepayment = amount + (amount * rate);
            var monthly = totalRepayment / term;

            document.getElementById('paymentDisplay').innerText = monthly.toFixed(2).replace('.', ',') + ' MT';
        }
        calculate();
    </script>
</body>
</html>
