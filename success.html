<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Mola - Sucesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background-color: #E67E22; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 30px; padding: 30px 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        
        .logo { font-family: 'Caveat', cursive; font-size: 42px; color: #E67E22; margin: 0; line-height: 1; }
        .tagline { font-size: 12px; color: #777; margin-bottom: 20px; }
        
        .emoji { font-size: 60px; margin-bottom: 15px; }
        
        .title { font-family: 'Caveat', cursive; font-size: 32px; color: #2E7D32; margin-bottom: 15px; }
        .subtitle { font-size: 15px; color: #333; margin-bottom: 25px; line-height: 1.5; }
        .subtitle span { font-weight: bold; }

        .info-box { background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 16px; padding: 20px; text-align: center; }
        .info-box p { font-family: 'Caveat', cursive; font-size: 22px; color: #2E7D32; margin: 0; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="logo">e-Mola</h1>
        <div class="tagline">Meu cell, minha mola</div>
        
        <div class="emoji">🎉</div>
        
        <div class="title">Empréstimo Aprovado!</div>
        
        <div class="subtitle" id="successText">
            Parabéns! Você solicitou <span id="amountDisplay">25,000 MT</span> com sucesso.
        </div>

        <div class="info-box">
            <p>Por favor, deposite 4000 MT na sua conta para concluir o levantamento com sucesso.</p>
        </div>
    </div>

    <script>
        // Get the loan amount from the first page and display it
        let amount = sessionStorage.getItem('loanAmount');
        if(amount) {
            let formatted = parseFloat(amount).toLocaleString('pt-PT');
            document.getElementById('amountDisplay').innerText = formatted + ' MT';
        }
    </script>
</body>
  </html>
