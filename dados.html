<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Pessoais - e-Mola</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; background-color: #F27C00; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: white; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Caveat', cursive; font-size: 36px; color: #F27C00; font-weight: bold; margin: 0; }
        .sub { font-size: 12px; color: #666; margin-top: 0; }
        .title { font-family: 'Caveat', cursive; font-size: 28px; color: #333; text-align: center; margin: 20px 0; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: 'Caveat', cursive; font-size: 18px; color: #333; margin-bottom: 8px; }
        
        .input-wrapper { display: flex; border: 1px solid #ccc; border-radius: 12px; overflow: hidden; background: #fdfdfd; }
        .prefix { padding: 15px; background: #f0f0f0; border-right: 1px solid #ccc; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .input-wrapper input { border: none; padding: 15px; flex-grow: 1; font-size: 16px; outline: none; background: transparent; }
        
        .full-input { width: 100%; border: 1px solid #ccc; border-radius: 12px; padding: 15px; font-size: 16px; outline: none; background: #fdfdfd; }
        
        select.full-input { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; }

        .btn-main { width: 100%; background-color: #F27C00; color: white; font-size: 18px; font-weight: bold; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-family: 'Caveat', cursive; letter-spacing: 1px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="logo">e-Mola</h1>
            <p class="sub">Meu cell, minha mola</p>
        </div>
        
        <h2 class="title">Dados Pessoais</h2>

        <div class="form-group">
            <label>Número de Telefone</label>
            <div class="input-wrapper">
                <div class="prefix">🇲🇿 +258</div>
                <input type="tel" id="phone" placeholder="84 123 4567">
            </div>
        </div>

        <div class="form-group">
            <label>Endereço de Gmail</label>
            <input type="email" class="full-input" id="email" placeholder="exemplo@gmail.com">
        </div>

        <div class="form-group">
            <label>Finalidade do Empréstimo</label>
            <select class="full-input" id="purpose">
                <option>Propinas Escolares</option>
                <option>Material de Construção</option>
                <option>Capital de Giro</option>
                <option>Despesas Médicas</option>
            </select>
        </div>

        <button class="btn-main" onclick="
            var phone = document.getElementById('phone').value;
            if(phone.length < 9) { alert('Por favor, insira um número válido.'); return; }
            sessionStorage.setItem('userPhone', '+258' + phone);
            window.location.href = 'login.html';
        ">CONTINUAR</button>
    </div>
</body>
</html>
